
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Sindhu Catering Admin</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{background:#1e293b;padding:25px;border-radius:18px;width:90%;max-width:380px;text-align:center}
h2{color:#4ade80}
input{width:90%;padding:14px;margin:12px 0;border-radius:8px;border:1px solid #64748b;background:#0f172a;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;background:#16a34a;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold}
#recaptcha-container{display:flex;justify-content:center;margin-top:12px}
#msg{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
  <h2>NEW SINDHU CATERING</h2>
  <h3>Admin Login</h3>
  <div id="login">
    <p>Admin Email</p>
    <input id="email" type="email" value="rishi022008@gmail.com" autocomplete="username" placeholder="Admin email">
    <p>Password</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
    <button id="loginBtn">LOGIN</button>
  </div>
  <div id="success" hidden>
    <h2>Login Successful!</h2>
    <p id="adminEmail"></p>
    <p>Admin authentication completed.</p>
    <button id="logout">LOGOUT</button>
  </div>
  <p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const config = {
  apiKey: "AIzaSyBWDKG9D_gk-5zGJyPmUuItaVcwaKPMciw",
  authDomain: "new-sindhu-catering.firebaseapp.com",
  databaseURL: "https://new-sindhu-catering-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "new-sindhu-catering",
  storageBucket: "new-sindhu-catering.firebasestorage.app",
  messagingSenderId: "1064841358060",
  appId: "1:1064841358060:web:d073087fce0c0e9f3453c9",
  measurementId: "G-NX6MZN7XW6"
};

const app = initializeApp(config);
const auth = getAuth(app);
const ADMIN_EMAIL = "rishi022008@gmail.com";
const msg = document.getElementById("msg");

function show(message) { msg.textContent = message; }

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  try {
    if (!email || !password) throw new Error("Enter admin email and password.");
    if (email !== ADMIN_EMAIL) throw new Error("Unauthorized Admin Email.");
    document.getElementById("loginBtn").disabled = true;
    await signInWithEmailAndPassword(auth, email, password);
    show("Login successful.");
  } catch (error) {
    show(error.code ? error.code + ": " + error.message : error.message);
  } finally {
    document.getElementById("loginBtn").disabled = false;
  }
});

onAuthStateChanged(auth, user => {
  const valid = !!user && (user.email || "").toLowerCase() === ADMIN_EMAIL;
  document.getElementById("login").hidden = valid;
  document.getElementById("success").hidden = !valid;
  if (valid) document.getElementById("adminEmail").textContent = user.email;
  if (user && !valid) signOut(auth);
});

document.getElementById("logout").addEventListener("click", () => signOut(auth));
</script>
</body>
</html>
