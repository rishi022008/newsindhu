<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sindhu Catering - Delivery Partner App</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .header { background: #d32f2f; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .header h2 { margin: 0 0 10px 0; font-size: 20px; }
        .duty-btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; background: #fff; color: #d32f2f; cursor: pointer; }
        .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .order-id { font-weight: bold; color: #d32f2f; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
        .btn-pickup { background: #ff9800; }
        .btn-map { background: #1976d2; }
        .btn-call { background: #388e3c; }
        .btn-deliver { background: #2e7d32; }
        .payment-box { margin-top: 15px; padding: 12px; background: #fff3e0; border-radius: 6px; border: 1px solid #ffe0b2; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-ready { background: #ffcc80; color: #e65100; }
        .badge-way { background: #81c784; color: #1b5e20; }
    </style>
</head>
<body>

<div class="header">
    <h2>🛵 New Sindhu Catering - Delivery App</h2>
    <button class="duty-btn" onclick="enableAudio()">🔔 Start Duty (Enable Alarm)</button>
</div>

<!-- Loud Ringtone Audio -->
<audio id="alarmAudio" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div id="ordersContainer">
    <p style="text-align:center; color:#666;">Waiting for new orders...</p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // Replace with your Firebase Config from admin.html
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let watchId = null;
    const alarm = document.getElementById('alarmAudio');

    function enableAudio() {
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
        alarm.play().then(() => {
            alarm.pause();
            alarm.currentTime = 0;
            alert("Duty Started! Loud alarm is active for incoming orders.");
        }).catch(err => console.error("Audio activation failed:", err));
    }

    db.ref('orders').on('value', (snapshot) => {
        const container = document.getElementById('ordersContainer');
        container.innerHTML = '';
        let hasReadyOrder = false;

        snapshot.forEach((child) => {
            const orderId = child.key;
            const order = child.val();

            if (order.status === 'Food Ready' || order.status === 'Out for Delivery') {
                if (order.status === 'Food Ready') {
                    hasReadyOrder = true;
                }

                const card = document.createElement('div');
                card.className = 'card';

                if (order.status === 'Food Ready') {
                    card.innerHTML = `
                        <div class="order-id">
                            <span>Order #${orderId.slice(-5)}</span>
                            <span class="status-badge badge-ready">FOOD READY</span>
                        </div>
                        <p><strong>Items:</strong> ${order.itemsSummary || 'Catering Order'}</p>
                        <p><strong>Total Amount:</strong> ₹${order.totalAmount}</p>
                        <button class="btn btn-pickup" onclick="pickupOrder('${orderId}')">📦 Pick Up from Shop</button>
                    `;
                } 
                else if (order.status === 'Out for Delivery') {
                    const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${order.customerLat},${order.customerLng}`;
                    card.innerHTML = `
                        <div class="order-id">
                            <span>Order #${orderId.slice(-5)}</span>
                            <span class="status-badge badge-way">OUT FOR DELIVERY</span>
                        </div>
                        <p><strong>Customer Name:</strong> ${order.customerName}</p>
                        <p><strong>Delivery Address:</strong> ${order.address}</p>
                        <p><strong>Amount to Collect:</strong> ₹${order.totalAmount}</p>
                        
                        <button class="btn btn-call" onclick="callCustomer('${order.customerPhone}')">📞 Call to Customer</button>
                        
                        <a href="${mapUrl}" target="_blank" style="text-decoration:none;">
                            <button class="btn btn-map">🗺️ Open Customer Location</button>
                        </a>

                        <div class="payment-box">
                            <label><strong>Select Payment Method:</strong></label><br><br>
                            <label><input type="radio" name="pay_${orderId}" value="COD" checked> 💵 Cash (COD)</label> &nbsp;&nbsp;&nbsp;
                            <label><input type="radio" name="pay_${orderId}" value="UPI"> 📱 UPI (GPay / PhonePe)</label>
                        </div>

                        <button class="btn btn-deliver" onclick="deliverOrder('${orderId}')">✅ Food Delivered</button>
                    `;
                }
                container.appendChild(card);
            }
        });

        if (hasReadyOrder) {
            alarm.play().catch(e => console.log("Tap 'Start Duty' to allow audio."));
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("New Order Ready!", { body: "Food is ready for pickup at the shop." });
            }
        } else {
            alarm.pause();
            alarm.currentTime = 0;
        }
    });

    function pickupOrder(orderId) {
        alarm.pause();
        alarm.currentTime = 0;

        db.ref('orders/' + orderId).update({
            status: 'Out for Delivery',
            pickedUpAt: Date.now()
        });

        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition((position) => {
                db.ref('orders/' + orderId + '/deliveryLocation').set({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude,
                    updatedAt: Date.now()
                });
            }, (error) => {
                console.error("GPS Tracking Error:", error);
            }, {
                enableHighAccuracy: true,
                maximumAge: 5000
            });
        } else {
            alert("GPS is not supported on this device.");
        }
    }

    function callCustomer(phone) {
        window.location.href = `tel:${phone}`;
    }

    function deliverOrder(orderId) {
        const paymentMode = document.querySelector(`input[name="pay_${orderId}"]:checked`).value;

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        db.ref('orders/' + orderId).update({
            status: 'Food Delivered',
            paymentMethod: paymentMode,
            deliveredAt: Date.now()
        }).then(() => {
            alert("Order marked as Food Delivered!");
        });
    }
</script>

</body>
</html>
