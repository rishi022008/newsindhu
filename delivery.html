<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Sindhu Catering - Delivery App</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f8fafc;font-family:Arial,sans-serif;padding:16px}
.wrap{max-width:600px;margin:auto}
.head{background:#1e293b;padding:16px;border-radius:14px;text-align:center;margin-bottom:16px}
.brand{color:#4ade80;font-weight:800;font-size:20px}
.duty-btn{background:#f59e0b;color:#000;border:0;border-radius:8px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;width:100%}
.duty-btn.active{background:#16a34a;color:#fff}
.card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid #334155}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{background:#f59e0b;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.pill.way{background:#38bdf8;color:#000}
.items{background:#0f172a;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:14px;line-height:1.5;margin:10px 0}
.btn{width:100%;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;color:#fff;display:block;text-align:center;text-decoration:none}
.btn-pickup{background:#ea580c}
.btn-call{background:#16a34a}
.btn-map{background:#2563eb}
.btn-deliver{background:#059669}
.pay-box{background:#0f172a;padding:12px;border-radius:8px;margin-top:12px;border:1px solid #475569}
.pay-opts{display:flex;gap:15px;margin-top:8px;font-size:16px;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:#94a3b8;background:#1e293b;border-radius:14px}
#loginBox{max-width:400px;margin:10vh auto;background:#1e293b;padding:24px;border-radius:14px;text-align:center}
input[type="email"],input[type="password"]{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #64748b;background:#0f172a;color:#fff;font-size:15px}
.logout-btn{background:#475569;color:#fff;border:0;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox">
    <div class="brand">🛵 NEW SINDHU CATERING</div>
    <h3>Delivery Partner Login</h3>
    <input id="email" type="email" value="rishi022008@gmail.com">
    <input id="password" type="password" placeholder="Enter Password">
    <button id="loginBtn" class="btn btn-call">LOGIN</button>
    <p id="loginErr" style="color:#fca5a5;font-size:14px"></p>
  </div>

  <div id="appBox" hidden>
    <div class="head">
      <div class="brand">🛵 NEW SINDHU CATERING</div>
      <div style="color:#cbd5e1;font-size:14px;margin-top:4px">Delivery Partner App</div>
      <button id="dutyBtn" class="duty-btn">🔔 TAP TO START DUTY (ENABLE ALARM)</button>
      <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
    <div id="ordersList"><div class="empty">Connecting to orders...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

const firebaseConfig={
 apiKey:'AIzaSyBWDKG9D_gk-5zGJyPmUuItaVcwaKPMciw',
 authDomain:'new-sindhu-catering.firebaseapp.com',
 databaseURL:'https://new-sindhu-catering-default-rtdb.asia-southeast1.firebasedatabase.app',
 projectId:'new-sindhu-catering',storageBucket:'new-sindhu-catering.firebasestorage.app',
 messagingSenderId:'1064841358060',appId:'1:1064841358060:web:d073087fce0c0e9f3453c9',measurementId:'G-NX6MZN7XW6'
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let actx = null, alarmTimer = null, watchId = null, trackingOrderId = null, stopListener = null;

document.getElementById('loginBtn').onclick = async () => {
  document.getElementById('loginErr').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
  } catch (e) {
    document.getElementById('loginErr').textContent = 'Login failed: ' + e.message;
  }
};

document.getElementById('logoutBtn').onclick = () => {
  stopAlarm();
  stopLiveGPS();
  if (stopListener) stopListener();
  signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('loginBox').hidden = true;
    document.getElementById('appBox').hidden = false;
    listenOrders();
  } else {
    document.getElementById('appBox').hidden = true;
    document.getElementById('loginBox').hidden = false;
  }
});

function playAlarm() {
  if (alarmTimer) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const ring = () => {
      const t = actx.currentTime;
      [0, 0.25, 0.5].forEach(d => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square';
        o.connect(g); g.connect(actx.destination);
        o.frequency.setValueAtTime(950, t + d);
        o.frequency.setValueAtTime(1250, t + d + 0.12);
        g.gain.setValueAtTime(0.4, t + d);
        g.gain.exponentialRampToValueAtTime(0.01, t + d + 0.22);
        o.start(t + d); o.stop(t + d + 0.22);
      });
    };
    ring();
    alarmTimer = setInterval(ring, 1200);
  } catch (e) { console.log(e); }
}

function stopAlarm() {
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}

document.getElementById('dutyBtn').onclick = function() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }
  this.textContent = "✅ DUTY ACTIVE (ALARM READY)";
  this.classList.add('active');
};

function startLiveGPS(orderId) {
  if (trackingOrderId === orderId && watchId !== null) return;
  stopLiveGPS();
  trackingOrderId = orderId;
  if ("geolocation" in navigator) {
    watchId = navigator.geolocation.watchPosition(pos => {
      set(ref(db, 'orders/' + orderId + '/deliveryLocation'), {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        updatedAt: Date.now()
      });
    }, err => console.error("GPS Error:", err), { enableHighAccuracy: true, maximumAge: 5000 });
  }
}

function stopLiveGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    trackingOrderId = null;
  }
}

function pick(o, keys) {
  for (const k of keys) { if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; }
  return '—';
}

function esc(v) {
  return String(v ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function listenOrders() {
  if (stopListener) stopListener();
  stopListener = onValue(ref(db, 'orders'), snap => {
    const data = snap.val() || {};
    const list = Object.entries(data)
      .map(([id, o]) => ({ id, ...(o || {}) }))
      .filter(o => {
        const st = o.orderStatus || o.status || '';
        return st === 'Ready' || st === 'Out for Delivery';
      });

    const container = document.getElementById('ordersList');
    container.innerHTML = '';

    let hasReady = false;
    let activeWayId = null;

    if (!list.length) {
      stopAlarm();
      stopLiveGPS();
      container.innerHTML = '<div class="empty">No active orders right now.<br>Waiting for Food Ready alert...</div>';
      return;
    }

    list.forEach(o => {
      const st = o.orderStatus || o.status;
      const name = pick(o, ['customerName', 'name', 'Customer Name']);
      const phone = pick(o, ['mobileNumber', 'phone', 'mobile', 'Mobile Number']);
      const address = pick(o, ['address', 'deliveryAddress', 'Address']);
      const items = pick(o, ['orderedItems', 'items', 'products', 'Ordered Items']);
      const amount = pick(o, ['amount', 'totalAmount', 'total', 'Amount']);
      const safeItems = Array.isArray(items)
        ? items.map(i => (i && typeof i === 'object') ? `${i.name} × ${i.quantity}` : String(i)).join('\n')
        : String(items);

      const card = document.createElement('div');
      card.className = 'card';

      if (st === 'Ready') {
        hasReady = true;
        card.innerHTML = `
          <div class="row">
            <strong style="font-size:18px;color:#4ade80">Order #${o.id.slice(-7)}</strong>
            <span class="pill">FOOD READY</span>
          </div>
          <div class="items">${esc(safeItems)}</div>
          <p style="margin:6px 0"><b>Amount to Collect:</b> ₹${esc(amount)}</p>
          <button class="btn btn-pickup" data-pickup="${o.id}">📦 PICK UP FROM SHOP</button>
        `;
      } else if (st === 'Out for Delivery') {
        activeWayId = o.id;
        let mapHref = o.mapLink || (o.gps ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.gps)}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`);

        card.innerHTML = `
          <div class="row">
            <strong style="font-size:18px;color:#38bdf8">Order #${o.id.slice(-7)}</strong>
            <span class="pill way">OUT FOR DELIVERY</span>
          </div>
          <p style="margin:6px 0"><b>Customer:</b> ${esc(name)}</p>
          <p style="margin:6px 0"><b>Address:</b> ${esc(address)}</p>
          <p style="margin:6px 0;font-size:18px;color:#4ade80"><b>Collect Amount: ₹${esc(amount)}</b></p>

          <a href="tel:${esc(phone)}" class="btn btn-call">📞 CALL TO CUSTOMER</a>
          <a href="${esc(mapHref)}" target="_blank" rel="noopener" class="btn btn-map">🗺️ CUSTOMER LOCATION</a>

          <div class="pay-box">
            <div style="color:#cbd5e1;font-size:13px">Select Customer Payment Mode:</div>
            <div class="pay-opts">
              <label><input type="radio" name="pay_${o.id}" value="COD" checked> 💵 COD</label>
              <label><input type="radio" name="pay_${o.id}" value="UPI"> 📱 UPI</label>
            </div>
          </div>

          <button class="btn btn-deliver" data-deliver="${o.id}">✅ FOOD DELIVERED</button>
        `;
      }
      container.appendChild(card);
    });

    if (hasReady) {
      playAlarm();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("New Order Ready!", { body: "Food is ready for pickup at New Sindhu Catering." });
      }
    } else {
      stopAlarm();
    }

    if (activeWayId) {
      startLiveGPS(activeWayId);
    } else {
      stopLiveGPS();
    }

    container.querySelectorAll('[data-pickup]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.pickup;
        stopAlarm();
        await update(ref(db, 'orders/' + id), {
          orderStatus: 'Out for Delivery',
          status: 'Out for Delivery',
          pickedUpAt: Date.now()
        });
        startLiveGPS(id);
      };
    });

    container.querySelectorAll('[data-deliver]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.deliver;
        const payMode = document.querySelector(`input[name="pay_${id}"]:checked`).value;
        stopLiveGPS();
        await update(ref(db, 'orders/' + id), {
          orderStatus: 'Delivered',
          status: 'Delivered',
          paymentMethod: payMode,
          paymentStatus: 'Paid (' + payMode + ')',
          deliveredAt: Date.now()
        });
        alert("Order marked as Food Delivered!");
      };
    });
  }, err => {
    document.getElementById('ordersList').innerHTML = '<div class="empty" style="color:#fca5a5">Error: ' + err.message + '</div>';
  });
}
</script>
</body>
</html>
