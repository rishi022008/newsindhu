<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Sindhu Catering</title>
<meta name="theme-color" content="#1f5c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New Sindhu">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;800&family=Mukta+Malar:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f2f5ee;--surface:#fff;--ink:#1d2a22;--muted:#5d6b62;--leaf:#1f5c3a;--on-leaf:#fff;--gold:#f2b632;--chili:#c8372d;--line:#d9e0d3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a14;--surface:#1a2620;--ink:#eaf1ea;--muted:#9fb0a4;--leaf:#5bbf86;--on-leaf:#0d1b12;--line:#2b3a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a14;--surface:#1a2620;--ink:#eaf1ea;--muted:#9fb0a4;--leaf:#5bbf86;--on-leaf:#0d1b12;--line:#2b3a31;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Mukta Malar",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--leaf);z-index:10}
h1,h2,h3{font-family:"Baloo Thambi 2","Mukta Malar",sans-serif;margin:0;line-height:1.2}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--leaf);color:var(--on-leaf);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:22px;font-weight:800;flex:1}
header small{display:block;font:400 13px "Mukta Malar",sans-serif;opacity:.9}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.back{font-size:22px;padding:4px 8px;color:var(--on-leaf)}
.banner{margin:14px 16px;padding:14px 16px;border-radius:14px;background:var(--gold);color:#2b2100;font-weight:600}
.banner b{font:800 20px "Baloo Thambi 2",sans-serif;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px}
.chip{flex:none;padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.list{padding:0 16px;display:grid;gap:12px}
.rest{display:flex;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.art{flex:none;width:68px;height:68px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:36px}
.rest h3{font-size:18px}
.meta{color:var(--muted);font-size:14px}
.free{color:var(--leaf);font-weight:600;font-size:14px}
.dish{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dish .art{width:52px;height:52px;font-size:28px}
.dish .info{flex:1}
.dot{display:inline-block;width:10px;height:10px;border:1.5px solid #2e9e57;border-radius:2px;margin-right:6px;position:relative;top:1px}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#2e9e57}
.dot.nv{border-color:var(--chili)}.dot.nv::after{background:var(--chili)}
.add{border:1.5px solid var(--leaf);color:var(--leaf);border-radius:8px;padding:4px 18px;font-weight:600}
.qty{display:flex;align-items:center;background:var(--leaf);color:var(--on-leaf);border-radius:8px}
.qty button{padding:4px 12px;font-size:18px;color:var(--on-leaf)}
.qty span{min-width:20px;text-align:center;font-weight:600}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;display:flex;justify-content:space-between;padding:14px 18px;background:var(--leaf);color:var(--on-leaf);border-radius:14px;font-weight:600;z-index:6}
.card{margin:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.total{font-weight:600;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
label{display:block;margin:10px 0 4px;font-weight:600}
input[type=text],input[type=tel]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.pay{display:flex;gap:16px;margin-top:6px}
.pay label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}
.err{color:var(--chili);font-size:14px;min-height:20px;margin-top:6px}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--muted)}
.steps li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--leaf);border-color:var(--leaf)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{border-color:var(--gold);background:var(--gold)}
.note{font-size:13px;color:var(--muted);margin:12px 16px}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:20;font-size:14px}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.cta{display:block;width:calc(100% - 32px);margin:8px 16px;padding:14px;border-radius:12px;background:var(--leaf);color:var(--on-leaf);font-weight:600;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sec{padding:16px 16px 6px}
.sec h2{font-size:20px;color:var(--leaf)}
.dish.dis{opacity:.55}
.add:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}
a.cta{text-decoration:none}
a.cta.alt{background:var(--surface);color:var(--leaf);border:1.5px solid var(--leaf)}
.msg{white-space:pre-wrap;font:14px/1.5 "Mukta Malar",sans-serif;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0 0}
.closed{background:var(--chili);color:#fff}
.banner b{font-size:18px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="bar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const PHONE="919094094214",SHOW="90940 94214";
/* Firebase setup: fill these two after creating the Firebase project (see steps) */

const FB={
  db:"https://new-sindhu-catering-a3594-default-rtdb.asia-southeast1.firebasedatabase.app",
  key:"AIzaSyCIZXTRJPYR8iCu0KwXFrp0Z44HOrVDFFc"
};
 
let OFF={};
const M=[
["Breakfast",[["Idli (2 Nos)",25],["Pongal",40],["Poori (2 Nos)",40],["Medhu Vada",10],["Masala Vada",10],["Appam with Coconut Milk (2 Nos)",50]]],
["Dosai Varieties",[["Plain Dosa",50],["Onion Dosa",70],["Onion Uthappam",70],["Kal Dosa (2 Nos)",50],["Ghee Dosa",75],["Podi Dosa",60]]],
["Breads",[["Chappathi",40],["Parotta (2 Nos)",40]]],
["Chilli Specials",[["Chilli Idli",120],["Chilli Parotta",120],["Mushroom Chilli Parotta",150],["Paneer Chilli Parotta",150]]],
["Kothu Parotta",[["Veg Kothu Parotta",120],["Paneer Kothu Parotta",150],["Mushroom Kothu Parotta",150]]],
["Sides",[["Vadacurry",30]]],
["Fried Rice",[["Veg Fried Rice",130],["Gopi Fried Rice",130],["Mushroom Fried Rice",130],["Paneer Fried Rice",130],["Mixed Fried Rice",140]]],
["Chinese Specials",[["Gobi Manchurian",130],["Mushroom Manchurian",130],["Paneer Manchurian",130],["Chilli Gobi",130],["Chilli Mushroom",130],["Chilli Paneer",130]]],
["Special Menu",[["Paneer Butter Masala",150,1]]]
];
const EM={"Idli (2 Nos)":"🍚","Pongal":"🥣","Poori (2 Nos)":"🫓","Medhu Vada":"🍩","Masala Vada":"🍘","Appam with Coconut Milk (2 Nos)":"🥞",
"Plain Dosa":"🌯","Onion Dosa":"🧅","Onion Uthappam":"🥞","Kal Dosa (2 Nos)":"🥞","Ghee Dosa":"🧈","Podi Dosa":"🌶️",
"Chappathi":"🫓","Parotta (2 Nos)":"🥐",
"Chilli Idli":"🌶️","Chilli Parotta":"🌶️","Mushroom Chilli Parotta":"🍄","Paneer Chilli Parotta":"🧀",
"Veg Kothu Parotta":"🥘","Paneer Kothu Parotta":"🧀","Mushroom Kothu Parotta":"🍄",
"Vadacurry":"🍛",
"Veg Fried Rice":"🍚","Gopi Fried Rice":"🥦","Mushroom Fried Rice":"🍄","Paneer Fried Rice":"🧀","Mixed Fried Rice":"🍛",
"Gobi Manchurian":"🥦","Mushroom Manchurian":"🍄","Paneer Manchurian":"🧀","Chilli Gobi":"🥦","Chilli Mushroom":"🍄","Chilli Paneer":"🧀",
"Paneer Butter Masala":"🍲"};
const S={view:"menu",cart:{},err:"",msg:"",f:{n:"",p:"",a:"",pay:"Cash",loc:"",ml:""}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const isOpen=()=>now()>=450&&now()<=1350;
const eveOk=()=>now()>=1110&&now()<=1350;
const rows=()=>Object.entries(S.cart).map(([k,q])=>{const[c,i]=k.split("-").map(Number);const it=M[c][1][i];return{k,q,n:it[0],sum:it[1]*q}});
const count=()=>rows().reduce((a,x)=>a+x.q,0);
const total=()=>rows().reduce((a,x)=>a+x.sum,0);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function go(v){S.view=v;S.err="";render();scrollTo(0,0)}
function readForm(){const g=id=>$("#"+id);if(!g("nm"))return;S.f.n=g("nm").value;S.f.p=g("ph").value;S.f.a=g("ad").value;if(g("ml"))S.f.ml=g("ml").value;const r=document.querySelector("input[name=pay]:checked");if(r)S.f.pay=r.value}
function render(){
  const y=scrollY,hd=$("#hd"),app=$("#app"),bar=$("#bar");
  const back=t=>`<button class="back" data-a="go" data-v="${t}" aria-label="Back">←</button>`;
  bar.innerHTML="";
  if(S.view==="admin"){renderAdmin(hd,app);scrollTo(0,y);return}
  if(S.view==="menu"){
    hd.innerHTML=`<h1>New Sindhu Catering<small>Pure Veg. Pure Love. · Mangadu-ல் டெலிவரி இலவசம்</small></h1>`;
    app.innerHTML=(isOpen()?"":`<div class="banner closed"><b>கடை இப்போது மூடப்பட்டுள்ளது</b>திறக்கும் நேரம்: 7:30 AM – 10:30 PM</div>`)+
    `<div class="chips">${M.map((c,i)=>`<button class="chip" data-a="jump" data-v="${i}">${c[0]}</button>`).join("")}</div>`+
    M.map((c,ci)=>`<section class="sec" id="s${ci}"><h2>${c[0]}</h2></section>`+c[1].map((it,i)=>{
      const q=S.cart[ci+"-"+i]||0,off=!!OFF[ci+"-"+i],lock=(it[2]&&!eveOk())||off;
      return`<div class="dish ${lock?"dis":""}"><div class="art" aria-hidden="true">${EM[it[0]]||"🍽️"}</div><div class="info">${it[0]}<div class="meta">₹${it[1]}${off?" · இப்போது இல்லை":it[2]?" · 6:30 PM – 10:30 PM மட்டும்":""}</div></div>`+
      (q?`<div class="qty"><button data-a="chg" data-c="${ci}" data-i="${i}" data-d="-1" aria-label="Remove one">−</button><span>${q}</span><button data-a="chg" data-c="${ci}" data-i="${i}" data-d="1" aria-label="Add one">+</button></div>`:
      `<button class="add" ${lock?"disabled":""} data-a="chg" data-c="${ci}" data-i="${i}" data-d="1">Add</button>`)+`</div>`}).join("")).join("");
    const n=count();
    if(n)bar.innerHTML=`<button class="bar" data-a="go" data-v="cart"><span>${n} item${n>1?"s":""} · ₹${total()}</span><span>Cart பார்க்க</span></button>`;
  }else if(S.view==="cart"){
    hd.innerHTML=`${back("menu")}<h1>உங்கள் Cart</h1>`;
    const r=rows();
    if(!r.length){app.innerHTML=`<div class="empty">Cart காலியா இருக்கு.<br>Menu-ல இருந்து சேர்க்கவும்.</div><button class="cta" data-a="go" data-v="menu">Menu பார்க்க</button>`;return}
    app.innerHTML=`<div class="card">${r.map(x=>`<div class="row"><span>${x.n} × ${x.q}</span><span>₹${x.sum}</span></div>`).join("")}
    <div class="row"><span>Delivery (Mangadu)</span><span class="free">Free</span></div>
    <div class="row total"><span>Total</span><span>₹${total()}</span></div></div>
    <div class="card"><label for="nm">பெயர்</label><input id="nm" type="text" autocomplete="name" value="${esc(S.f.n)}">
    <label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(S.f.p)}">
    <label for="ad">Mangadu delivery address</label><input id="ad" type="text" autocomplete="street-address" value="${esc(S.f.a)}">
    <label>Delivery location (pin)</label>
    <div id="map" role="application" aria-label="Delivery location map" style="height:260px;margin-top:6px;border-radius:12px;border:1px solid var(--line);isolation:isolate"></div>
    <div class="meta">Map-ல தட்டுங்க அல்லது pin-ஐ இழுத்து உங்க வீட்டில் வைங்க. Map வரலன்னா கீழ உள்ள link முறையை பயன்படுத்தவும்.</div>
    <a class="cta alt" style="margin:6px 0 0;width:100%" target="_blank" rel="noopener" href="https://www.google.com/maps">📍 Google Maps திறந்து pin போடு</a>
    <div class="meta">Map-ல உங்க வீட்டு இடத்தை அழுத்திப் பிடிச்சு pin போடுங்க → Share → Copy link → கீழ paste பண்ணுங்க.</div>
    <input id="ml" type="text" inputmode="url" placeholder="Maps link paste பண்ணவும்" value="${esc(S.f.ml||"")}" style="margin-top:6px">
    <button class="cta alt" style="margin:10px 0 0;width:100%" data-a="loc">என் இடத்தை auto-ஆ எடு (GPS)</button>
    <div class="meta" id="locst">${S.f.loc?"GPS location சேர்ந்தது ✓":"GPS அனுமதி கிடைச்சா தானா சேரும்."}</div>
    <label>Payment</label><div class="pay"><label><input type="radio" name="pay" value="Cash" ${S.f.pay==="Cash"?"checked":""}> Cash</label><label><input type="radio" name="pay" value="UPI" ${S.f.pay==="UPI"?"checked":""}> UPI</label></div>
    <div class="err" id="err" role="alert">${esc(S.err)}</div></div>
    <button class="cta" data-a="place">Order தயார் செய் · ₹${total()}</button>`;
  }else{
    hd.innerHTML=`<h1>Order தயார்<small>WhatsApp-ல் அனுப்பினால் தான் கடைக்கு போகும்</small></h1>`;
    app.innerHTML=`<div class="card"><h2>கடைசி படி</h2><div class="msg">${esc(S.msg)}</div></div>
    <a class="cta" target="_blank" rel="noopener" href="https://wa.me/${PHONE}?text=${encodeURIComponent(S.msg)}">WhatsApp-ல் Order அனுப்பு</a>
    <a class="cta alt" href="tel:+${PHONE}">போன் பண்ணி Order பண்ண · ${SHOW}</a>
    <button class="cta alt" data-a="copy">Order text copy பண்ணு</button>
    <button class="cta alt" data-a="new">புதிய Order</button>`;
  }
  if(S.view==="cart")initMap();scrollTo(0,y);
}
S.adm={tok:"",err:"",em:""};
const INPUT_CSS="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit";
function renderAdmin(hd,app){
  hd.innerHTML=`<button class="back" data-a="go" data-v="menu" aria-label="Back">←</button><h1>கடை நிர்வாகம்<small>Item கிடைக்கும் / கிடைக்காது மாற்ற</small></h1>`;
  if(!FB.db){app.innerHTML=`<div class="empty">Firebase இன்னும் இணைக்கப்படல. Setup முடிஞ்சதும் இங்க on/off வேலை செய்யும்.</div>`;return}
  if(!S.adm.tok){
    app.innerHTML=`<div class="card"><label for="ae">Email</label><input id="ae" type="text" inputmode="email" autocomplete="username" value="${esc(S.adm.em)}" style="${INPUT_CSS}"><label for="apw">Password</label><input id="apw" type="password" autocomplete="current-password" style="${INPUT_CSS}"><div class="err" role="alert">${esc(S.adm.err)}</div></div><button class="cta" data-a="alogin">Login</button>`;
    return;
  }
  app.innerHTML=M.map((c,ci)=>`<section class="sec"><h2>${c[0]}</h2></section>`+c[1].map((it,i)=>{
    const k=ci+"-"+i;
    return`<div class="dish"><div class="art" aria-hidden="true">${EM[it[0]]||"🍽️"}</div><div class="info">${it[0]}<div class="meta">${OFF[k]?"இப்போது இல்லை":"கிடைக்கும்"}</div></div><input type="checkbox" role="switch" aria-label="${it[0]} கிடைக்கும்" ${OFF[k]?"":"checked"} data-a="tog" data-k="${k}" style="width:28px;height:28px"></div>`}).join("")).join("");
}
function loadOff(){
  if(!FB.db)return;
  fetch(FB.db+"/off.json").then(r=>r.json()).then(d=>{OFF=(d&&typeof d==="object")?d:{};if(S.view==="menu")render()}).catch(()=>{});
}
async function adminLogin(){
  const em=$("#ae").value.trim(),pw=$("#apw").value;S.adm.em=em;S.adm.err="";
  try{
    const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(FB.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})});
    const j=await r.json();
    if(!r.ok||!j.idToken)throw new Error("login");
    S.adm.tok=j.idToken;
  }catch(e){S.adm.err="Login ஆகல. Email, password சரிபாருங்கள்."}
  render();
}
async function saveOff(){
  render();
  try{
    const r=await fetch(FB.db+"/off.json?auth="+encodeURIComponent(S.adm.tok),{method:"PUT",body:JSON.stringify(OFF)});
    if(!r.ok)throw new Error("write");
    toast("சேமிக்கப்பட்டது");
  }catch(e){S.adm.tok="";S.adm.err="சேமிக்க முடியல. மீண்டும் login பண்ணுங்கள்.";render()}
}
let MAP=null;
function initMap(){
  const el=$("#map");if(!el)return;
  try{if(MAP){MAP.remove();MAP=null}}catch(x){MAP=null}
  if(typeof L==="undefined"){el.style.display="none";return}
  const c=S.f.loc?S.f.loc.split(",").map(Number):[13.0358,80.1107];
  MAP=L.map(el).setView(c,S.f.loc?17:14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP);
  const mk=L.marker(c,{draggable:true}).addTo(MAP);
  const set=ll=>{S.f.loc=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);const m=$("#locst");if(m)m.textContent="Pin சேர்ந்தது ✓"};
  MAP.on("click",e=>{mk.setLatLng(e.latlng);set(e.latlng)});
  mk.on("dragend",()=>set(mk.getLatLng()));
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==="go"){readForm();go(d.v)}
  else if(a==="jump"){$("#s"+d.v).scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="chg"){const k=d.c+"-"+d.i,q=(S.cart[k]||0)+ +d.d;if(q<=0)delete S.cart[k];else S.cart[k]=q;render()}
  else if(a==="place"){
    readForm();const f=S.f;
    const gone=Object.keys(S.cart).filter(k=>OFF[k]);
    if(gone.length){gone.forEach(k=>delete S.cart[k]);S.err="சில items இப்போது கிடைக்காது. Cart-ல இருந்து நீக்கிட்டோம், மீண்டும் சரிபாருங்கள்.";return render()}
    if(!f.n.trim()||!f.a.trim()){S.err="பெயர், address இரண்டையும் நிரப்பவும்.";return render()}
    if(!/^[6-9]\d{9}$/.test(f.p.trim())){S.err="சரியான 10 இலக்க mobile number கொடுக்கவும்.";return render()}
    if(f.ml&&f.ml.trim()&&!/^https?:\/\/\S*(maps|goo\.gl)\S*$/i.test(f.ml.trim())){S.err="Maps link சரியா இல்ல. Google Maps-ல Share → Copy link பண்ணி paste பண்ணவும்.";return render()}
    S.msg="New Sindhu Catering – புதிய Order\n\nபெயர்: "+f.n.trim()+"\nMobile: "+f.p.trim()+"\nAddress: "+f.a.trim()+"\n\n"+rows().map(x=>"• "+x.n+" × "+x.q+" = ₹"+x.sum).join("\n")+"\n\nTotal: ₹"+total()+" (Delivery free)\nPayment: "+f.pay+(f.ml&&f.ml.trim()?"\nLocation: "+f.ml.trim():f.loc?"\nLocation: https://maps.google.com/?q="+f.loc:"");
    go("done");
  }
  else if(a==="loc"){readForm();if(!navigator.geolocation){S.err="இந்த phone-ல location கிடைக்கல. Address-ஐ type பண்ணவும்.";return render()}toast("Location எடுக்கிறேன்...");navigator.geolocation.getCurrentPosition(p=>{S.f.loc=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);S.err="";render()},()=>{S.err="Location அனுமதி கிடைக்கல. Address-ஐ type பண்ணவும்.";render()},{enableHighAccuracy:true,timeout:10000})}
  else if(a==="alogin"){adminLogin()}
  else if(a==="tog"){const k=d.k;if(OFF[k])delete OFF[k];else OFF[k]=true;saveOff()}
  else if(a==="copy"){try{navigator.clipboard.writeText(S.msg).then(()=>toast("Copy ஆச்சு")).catch(()=>toast("மேலே உள்ள text-ஐ press பண்ணி copy பண்ணவும்"))}catch(x){toast("மேலே உள்ள text-ஐ press பண்ணி copy பண்ணவும்")}}
  else if(a==="new"){S.cart={};S.f.pay="Cash";go("menu")}
});
if(location.hash==="#admin")S.view="admin";
addEventListener("hashchange",()=>{S.view=location.hash==="#admin"?"admin":"menu";render()});
render();loadOff();
setInterval(()=>{if(S.view!=="admin")loadOff()},60000);
</script>
</body>
</html>
